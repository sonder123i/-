name: Deploy Site

on:
  push:
    branches: [master]
    paths:
      - 'docs/update/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # 官网源码在独立仓库；Vite 会按当前仓库名自动设置 base=/CloudTrace/
      - name: Checkout site source
        uses: actions/checkout@v5
        with:
          repository: sonder123i/new
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp -R site/dist/. _site/
          # 保留应用内更新清单在 /CloudTrace/update/stable.json
          cp -R docs/update _site/update
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4