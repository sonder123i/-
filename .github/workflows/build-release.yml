name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  Build:
    name: Release APK
    runs-on: ubuntu-latest
    env:
      # 可选：配置后自动把 Release 与仓库信息同步到 Gitee
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      # 可选：配置四项后切换到“无签名构建 + v3 lineage 签名”
      ROTATE_SIGNING_KEY: ${{ secrets.ROTATE_SIGNING_KEY }}
      ROTATE_KEY_PASSWORD: ${{ secrets.ROTATE_KEY_PASSWORD }}
      ROTATE_KEY_ALIAS: ${{ secrets.ROTATE_KEY_ALIAS }}
      SIGNING_LINEAGE: ${{ secrets.SIGNING_LINEAGE }}
    steps:
      # https://github.com/marketplace/actions/checkout
      - uses: actions/checkout@v5

      # 设置 JDK
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Get Tag
        id: var
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      # 创建 local.properties：地图 KEY 与发布签名均来自仓库 secrets
      - name: Create local.properties
        run: |
          cat << EOF > local.properties
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          MAPS_SAFE_CODE=${{ secrets.MAPS_SAFE_CODE }}
          EOF
          # 轮换模式：不配置 Gradle 签名，产出未签名 APK，后面用 lineage 签
          if [ -z "${ROTATE_SIGNING_KEY:-}" ]; then
            {
              echo "GOGOGO_KEYSTORE_FILE=keystore/release.jks"
              echo "GOGOGO_KEYSTORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}"
              echo "GOGOGO_KEY_ALIAS=${{ secrets.ALIAS }}"
              echo "GOGOGO_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
            } >> local.properties
          else
            echo "Rotation signing enabled: Gradle will produce an unsigned APK"
          fi

      - name: Decode signing keystore
        if: env.ROTATE_SIGNING_KEY == ''
        run: |
          if [ -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo "::error::SIGNING_KEY secret is empty; refusing to publish an unsigned APK"
            exit 1
          fi
          mkdir -p keystore
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore/release.jks
          test -s keystore/release.jks || { echo "::error::keystore decode failed"; exit 1; }

      - name: Build APK
        run: bash ./gradlew assembleRelease

      - name: Get APK Path
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          test -n "$APK_PATH" || { echo "::error::no release APK produced"; exit 1; }
          echo "APK_PATH=${APK_PATH}" >> $GITHUB_ENV
          echo "FILENAME=$(basename "$APK_PATH")" >> $GITHUB_ENV

      - name: Sign with rotated key
        if: env.ROTATE_SIGNING_KEY != ''
        run: |
          set -euo pipefail
          echo "$ROTATE_SIGNING_KEY" | base64 -d > /tmp/rotate.jks
          echo "$SIGNING_LINEAGE" | base64 -d > /tmp/lineage.bin
          test -s /tmp/rotate.jks || { echo "::error::ROTATE_SIGNING_KEY decode failed"; exit 1; }
          test -s /tmp/lineage.bin || { echo "::error::SIGNING_LINEAGE decode failed"; exit 1; }
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$SIGNER" sign \
            --ks /tmp/rotate.jks \
            --ks-pass "env:ROTATE_KEY_PASSWORD" \
            --ks-key-alias "$ROTATE_KEY_ALIAS" \
            --lineage /tmp/lineage.bin \
            --out "${APK_PATH%.apk}-signed.apk" "$APK_PATH"
          mv "${APK_PATH%.apk}-signed.apk" "$APK_PATH"
          rm -f /tmp/rotate.jks /tmp/lineage.bin

      - name: Verify APK signature
        run: |
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$SIGNER" verify --print-certs "${{ env.APK_PATH }}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FILENAME }}
          path: ${{ env.APK_PATH }}

      # https://github.com/marketplace/actions/auto-changelog
      # require commit format are "type(category): description [flag]"
      - name: Make Changelog
        uses: ardalanamini/auto-changelog@v4.0.4
        id  : changelog
        with:
          github-token            : ${{ github.token }}
          commit-types            : |
            feat: New Features
            fix: Bug Fixes
            build: Build System & Dependencies
            perf: Performance Improvements
            docs: Documentation
            test: Tests
            refactor: Refactors
            chore: Chores
            ci: CI
            style: Code Style
            revert: Reverts
          default-commit-type     : Other Changes
          mention-authors         : true
          mention-new-contributors: true
          include-compare-link    : true

      - name: Upload Changelog
        uses: actions/upload-artifact@v7
        with:
          name: Changelog
          path: ${{ steps.changelog.outputs.changelog }}

      # https://github.com/marketplace/actions/gh-release
      - name: Release APK
        uses: softprops/action-gh-release@v2.3.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ github.token }}
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: false
          files: ${{ env.APK_PATH }}

      # 可选：GITEE_TOKEN 存在时，把同一份 APK 同步到 Gitee 发行版，
      # 并顺手维护 Gitee 仓库的介绍与官网字段。失败不影响 GitHub 发布。
      - name: Sync Gitee release
        if: startsWith(github.ref, 'refs/tags/') && env.GITEE_TOKEN != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          API="https://gitee.com/api/v5/repos/${OWNER}/cloud-traces"

          echo "::group::Gitee repository metadata"
          curl -fsS -X PATCH "$API" \
            -d "access_token=${GITEE_TOKEN}" \
            -d "name=cloud-traces" \
            --data-urlencode "description=云迹（CloudTrace）— 开源 Android 位置模拟：地图选点、线路巡航、悬浮摇杆。GPL-3.0。" \
            --data-urlencode "homepage=https://${OWNER}.github.io/CloudTrace/" > /dev/null \
            || echo "::warning::Gitee metadata update failed (check token scope)";
          echo "::endgroup::"

          RID=$(curl -fsS "$API/releases" | jq -r --arg t "$TAG" '.[] | select(.tag_name == $t) | .id' | head -n1)
          if [ -z "$RID" ]; then
            BODY=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body --jq .body)
            RID=$(curl -fsS -X POST "$API/releases" \
              -d "access_token=${GITEE_TOKEN}" \
              --data-urlencode "tag_name=${TAG}" \
              --data-urlencode "target_commitish=master" \
              --data-urlencode "name=云迹 ${TAG#v}" \
              --data-urlencode "body=${BODY}" | jq -r .id)
          fi
          echo "Gitee release id: ${RID}"

          HAS=$(curl -fsS "$API/releases/${RID}" | jq -r --arg n "$FILENAME" '[.assets[]? | select(.name == $n)] | length')
          if [ "$HAS" = "0" ]; then
            curl -fsS -X POST "$API/releases/${RID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${APK_PATH}" > /dev/null
            echo "uploaded ${FILENAME} to Gitee"
          else
            echo "Gitee asset already present"
          fi
