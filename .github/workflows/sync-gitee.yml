name: Sync Gitee

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 Release tag（留空则只更新仓库信息）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require GITEE_TOKEN
        run: |
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error::请先在 Settings → Secrets 添加 GITEE_TOKEN（Gitee 个人令牌，projects 权限）"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Sync repository metadata and release
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          API="https://gitee.com/api/v5/repos/${OWNER}/cloud-traces"

          echo "::group::Update Gitee repository metadata"
          curl -fsS -X PATCH "$API" \
            -d "access_token=${GITEE_TOKEN}" \
            -d "name=cloud-traces" \
            --data-urlencode "description=云迹（CloudTrace）— 开源 Android 位置模拟：地图选点、线路巡航、悬浮摇杆。GPL-3.0。" \
            --data-urlencode "homepage=https://${OWNER}.github.io/CloudTrace/" > /dev/null
          echo "::endgroup::"

          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "未指定 tag，仅同步仓库信息"
            exit 0
          fi

          mkdir -p dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist
          FILE=$(ls dist/*.apk | head -n 1)
          test -n "$FILE" || { echo "::error::Release $TAG 没有 APK"; exit 1; }

          RID=$(curl -fsS "$API/releases" | jq -r --arg t "$TAG" '.[] | select(.tag_name == $t) | .id' | head -n1)
          if [ -z "$RID" ]; then
            BODY=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body --jq .body)
            RID=$(curl -fsS -X POST "$API/releases" \
              -d "access_token=${GITEE_TOKEN}" \
              --data-urlencode "tag_name=${TAG}" \
              --data-urlencode "name=云迹 ${TAG#v}" \
              --data-urlencode "body=${BODY}" | jq -r .id)
          fi
          echo "Gitee release id: ${RID}"

          NAME=$(basename "$FILE")
          HAS=$(curl -fsS "$API/releases/${RID}" | jq -r --arg n "$NAME" '[.assets[]? | select(.name == $n)] | length')
          if [ "$HAS" = "0" ]; then
            curl -fsS -X POST "$API/releases/${RID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${FILE}" > /dev/null
            echo "uploaded ${NAME}"
          else
            echo "asset already present: ${NAME}"
          fi